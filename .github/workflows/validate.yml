name: validate

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -c constraints.lock -e ".[dev]"

      - name: Validate repository contract
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker

      - name: Build image
        run: docker build -t model-drift-detector .

      - name: Lint
        run: docker run --rm --entrypoint python model-drift-detector -m ruff check src tests tools

      - name: Test with coverage
        run: docker run --rm --entrypoint python model-drift-detector -m pytest --cov=model_drift --cov-report=term-missing --cov-fail-under=90

      - name: Run isolated V2 smoke benchmark
        shell: pwsh
        run: ./tools/benchmark.ps1 -Rows 400 -Repetitions 3 -HardwareClass github-actions-linux -ResultsDirectory "$env:RUNNER_TEMP/model-drift-results" -OutputPath "$env:RUNNER_TEMP/model-drift-v2.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-drift-detector-ci-${{ github.sha }}
          path: ${{ runner.temp }}/model-drift-v2.json
          if-no-files-found: error
