[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-drift-detector"
version = "1.0.0"
description = "Auditable data and prediction drift detection with labeled scenario evaluation"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "pydantic==2.13.4",
  "prometheus-client==0.25.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
]

[project.scripts]
model-drift-detector = "model_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_drift = ["contracts/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
