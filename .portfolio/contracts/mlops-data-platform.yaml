schema_version: 1
system_id: mlops-data-platform
purpose: Connect independently deployable portfolio repositories through versioned data artifacts instead of source-code coupling.
integration_style: artifact-manifest-pipeline
rules:
  - Each repository owns its domain code, persistence, benchmark, and release lifecycle.
  - Cross-repository exchange uses versioned manifests and immutable SHA-256 artifact identity.
  - Consumers fail closed on unknown schema versions, failed quality status, digest mismatch, or incompatible contract identity.
  - Local Docker execution is the default; cloud storage or orchestration remains behind project-owned ports.
  - A repository may demonstrate its contract with fixtures without claiming a deployed multi-repository runtime.
stages:
  - project: data-quality-checks
    number: 26
    role: validation-gate
    consumes:
      - raw-batch
      - versioned-data-contract
    produces:
      - contract: validated-batch-manifest-v1
        schema: validated-batch-manifest-v1.schema.json
        artifacts: [accepted, quarantine]
  - project: feature-store-lite
    number: 23
    role: point-in-time-feature-materialization
    consumes:
      - validated-batch-manifest-v1
    produces:
      - contract: feature-snapshot-v1
        status: planned-not-claimed
    evidence:
      publication: feature-store-lite@6f8c957807a122d189fe8021c80cfd3e2639e329
      exact_head_ci: 31991401685
  - project: mlops-end2end
    number: 21
    role: train-register-deploy-monitor
    consumes:
      - validated-training-data
      - feature-snapshot-v1
    produces:
      - model-registry-record
      - prediction-observation-batch
  - project: stroke-signal-demo
    number: 4
    role: clinical-reproduction-and-evaluation
    consumes:
      - validated-clinical-splits
    produces:
      - medical-evaluation-report
  - project: model-drift-detector
    number: 22
    role: baseline-current-comparison
    consumes:
      - validated-batch-manifest-v1
      - feature-snapshot-v1
      - prediction-observation-batch
    compatibility_rule: validated-batch-manifest-v1 is required for the current closure; feature-snapshot-v1 and prediction-observation-batch remain optional until implemented by both producer and consumer.
    produces:
      - drift-report-v1
  - project: kafka-streams-demo
    number: 28
    role: event-stream-processing-proof
    consumes:
      - versioned-business-event
    produces:
      - windowed-business-aggregate
    boundary: Does not claim direct data-lifecycle integration until a shared event contract is implemented and measured.
completion_order: [26, 23, 22, 4]
