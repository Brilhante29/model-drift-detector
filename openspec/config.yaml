schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: model-drift-detector (#22)
  Program: mlops-data-platform
  Claim: verify immutable monitoring batches and score auditable data/prediction drift alarms.
  Upstream system role: mlops-end2end (#21) owns training, registry, promotion, and serving.
  Source of truth:
    - Use .portfolio/ as the synchronized reuse-kit snapshot.
    - Use project.yaml for the public project contract.
    - Use sdd/ for accepted decisions and release gates.
    - Use openspec/changes/ship-model-drift-detector for the active change.
rules:
  intent:
    - Distinguish data and prediction drift proxies from model-performance drift requiring labels.
  portfolio-impact:
    - Connect through the monitoring-batch contract; never import upstream application code.
  architecture-record:
    - Challenge significance-only alarms, hidden framework defaults, and ceremonial ports.
    - Reject service, broker, orchestrator, cloud, and retraining abstractions without a measured force.
  component-pack:
    - Use mlops-data-platform, python-model-monitoring, and benchmark-harness guidance.
  reuse-delta:
    - Patch cross-project contract and governance gaps into the kit; keep detector thresholds and fixtures local.
  benchmark-proof:
    - Preserve labeled stable/shift scenarios, confusion counts, F1, FPR, timing, thresholds, blind spots, environment, and failures.
    - Keep evidence pending or invalidated until the immutable Docker runs and README agree.
  verification:
    - Verify artifact tamper rejection, Holm and effect policy, detector/telemetry substitution, bounded metrics, Docker, raw JSON, summary, and CI.
